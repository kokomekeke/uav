version: '3.9'

# This configuration is for the ComInt Operation Extension
# (ground server)

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5432:5432
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=S3cret
      - POSTGRES_USER=pysagax_gnd
      - POSTGRES_DB=comint