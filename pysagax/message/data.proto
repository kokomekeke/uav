syntax = "proto3";

package pysagax.message;
import "google/protobuf/timestamp.proto";
import "pysagax/message/heading.proto";

message CsCalibrationTelemetry {


    google.protobuf.Timestamp time = 1;

    uint64 frequency = 2;
    uint32 refChannelId = 4;
    uint32 selfChannelId = 5;

    uint64 calibration_counter = 6;
    string calibration_status = 7;
    float refMagnitude = 8;
    float selfMagnitude = 9;

    int32 calibrationRe = 10;
    int32 calibrationIm = 11;

    string label = 13;

    repeated int32 validationMeasRe = 14;
    repeated int32 validationMeasIm = 15;
}

message Version {
    uint32 major = 1;
    uint32 minor = 2;
    uint32 patch = 3;
    string prerelase = 4;
    string buildmetadata = 5;
}

message Telemetry {
    // Non-critical information changing regularly

    google.protobuf.Timestamp time = 1;
    fixed32 stream_id = 2;
    Version cs_version = 3;

    // Hardware info
    message Hardware {
        float cpu_usage = 1; // Average CPU usage in 0-1 range
        uint32 disk_usage = 2; // Disk usage in megabytes. Total space in Sysinfo message
        float cpu_temperature = 3; // °C
        uint32 ram_usage = 5; // RAM usage in megabytes. Total RAM in Sysinfo message
        string hostname = 10;
    }
    Hardware hardware = 5;

    // Source info
    message Source {
        // Source status
        enum Status {
            DISABLED = 0;
            ENABLED = 1;
            RUNNING = 2;
        }
        Status status = 3;

        enum Mode {
            MANUAL = 0;
            UNDER_CONFIG = 1;
            CALIBRATION = 2;
            SCANNING = 3;
            UNDEFINED = 4;
        }
        Mode mode = 7;

        // current status progress in precentage
        float progress = 14;
        // Current position in selected source
        uint64 position = 5;

        // Length of selected source
        uint64 length = 6;
    }
    Source source = 9;

    // Recording info
    message Recording {
        // Recording status
        enum Status {
            DISABLED = 0;
            ENABLED = 1;
            RUNNING = 2;
        }
        Status status = 1;

        // Path of recording being written
        string filename = 2;

        // Current length of recording
        uint64 length = 3;
    }
    Recording recording = 10;
    HeadingStatus heading = 11;
    string scanengine_state = 12;
    repeated CsCalibrationTelemetry cs_calib_telemetry = 13;
}

message Detection {
    // A single detection instance

    // ID of Event to which it belongs
    uint32 event_id = 1;

    // ID of source region
    uint32 roi_id = 6;

    // General detection information
    float frequency = 7;
    float bandwidth = 8;
    float strength = 9;
    float azimuth = 10;
    float elevation = 11;
    float snr = 12;
    float deviation = 13;
    float mean_azimuth = 14;
    float mean_elevation = 15;
    int32 mean_window = 4;
}

message Spectrum {
    // Spectrum data

    int32 channel_id = 1;

    // Type of spectrum contained
    enum SpectrumType {
        MAGNITUDE = 0;
        AZIMUTH = 1;
        ELEVATION = 2;
    }
    SpectrumType spectrum_type = 2;

    // Data type of data in byte array
    enum DataType {
        INT16 = 0;
        INT8 = 1;
        FLOAT16 = 4;
        FLOAT32 = 5;
    }
    DataType data_type = 3;
    
    bytes data = 5;

    float center_frequency = 7;
    float bandwidth = 8;
}

message Measurement {
    // Constanstly steamed data

    google.protobuf.Timestamp time = 1;
    uint32 stream_id = 2;

    // ID of configuration at time of measurement
    uint32 config_id = 3;
    google.protobuf.Timestamp source_time = 4;
    // Metadata
    uint64 packet_id = 5;
    uint64 position = 6;
    reserved 7;
    repeated float quaternion = 8;
    bool overflow = 9;
    repeated int32 peaks = 10;
    HeadingData heading_data = 11;
    uint64 sampleIndex = 12;
    // Spectrum data
    repeated Spectrum data = 13;

    // Detections made on above spectrum
    repeated Detection detection = 17;
}

message Event {
    // High-level ComInt event, aggregate of one or more Detections

    google.protobuf.Timestamp time = 1;
    uint32 stream_id = 2;

    // ID of event
    uint32 event_id = 5;

    // General information
    float frequency = 6;
    float strength = 7;
    float lob = 8;
    float certainty = 9;
    float duration = 10;
    google.protobuf.Timestamp detection = 11;
}

message OperationalError {
    // Error during operation (not during command execution)

    enum ErrorType {
        // Possible error types
        UNKNOWN = 0;
    }

    // General error information
    google.protobuf.Timestamp time = 1;
    ErrorType type = 2;

    // Detailed error message
    string description = 5;
}
